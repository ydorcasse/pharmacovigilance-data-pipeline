version: 2

models:
  - name: dim_demo
    description: >
      Dimension cas/patient. Dédupliquée (une ligne par caseid, version max),
      cas supprimés par la FDA exclus.
    columns:
      - name: primaryid
        description: "Identifiant unique du rapport (caseid + caseversion)."
        tests: [unique, not_null]
      - name: caseid
        description: "Identifiant du cas, stable entre versions."
        tests: [unique, not_null]
      - name: age_years
        description: "Âge normalisé en années (null si inconnu)."
      - name: age_group
        description: "Tranche d'âge."
        tests:
          - accepted_values:
              arguments:
                values: ['0 - 17', '18 - 64', '65+', 'Unknown']
      - name: sex
        description: "Sexe décodé."
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Unknown']
      - name: reporter_type
        description: "Type de déclarant décodé."
      - name: occr_country
        description: "Pays de survenue de l'événement."

  - name: dim_drug
    description: "Dimension médicament : catalogue des produits distincts (clé = drug_key)."
    columns:
      - name: drug_key
        description: "Clé normalisée du médicament."
        tests: [unique, not_null]
      - name: drugname
        description: "Nom représentant du médicament."

  - name: dim_active_ingredient
    description: "Dimension principe actif : catalogue des principes actifs distincts."
    columns:
      - name: active_ingredient_key
        description: "Clé normalisée du principe actif."
        tests: [unique, not_null]
      - name: active_ingredient_name
        description: "Nom représentant du principe actif."

  - name: dim_reaction
    description: "Dimension réaction : termes MedDRA (pt) distincts (clé = reaction_key)."
    columns:
      - name: reaction_key
        description: "Clé normalisée de la réaction."
        tests: [unique, not_null]
      - name: pt
        description: "Terme préféré MedDRA représentant."
        tests: [not_null]

  - name: dim_outc
    description: "Dimension issue : 7 codes d'issue + libellé lisible."
    columns:
      - name: outc_cod
        description: "Code de l'issue (clé)."
        tests: [unique, not_null]
      - name: outcome_label
        description: "Libellé lisible du code."

  - name: dim_date
    description: "Dimension temps générée : une ligne par jour."
    columns:
      - name: date_day
        description: "La date (clé de la dimension)."
        tests: [unique, not_null]

  - name: fact_adverse_event
    description: >
      Fait principal : une ligne par (cas retenu × médicament suspect × réaction),
      clés uniquement. Médicaments filtrés sur role_cod PS/SS; cas retenus via dim_demo.
    columns:
      - name: primaryid
        description: "FK vers dim_demo."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demo')
                field: primaryid
      - name: drug_key
        description: "FK vers dim_drug."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: active_ingredient_key
        description: "FK vers dim_active_ingredient (nullable : produits sans PA connu)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_active_ingredient')
                field: active_ingredient_key
      - name: reaction_key
        description: "FK vers dim_reaction."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reaction')
                field: reaction_key
      - name: fda_dt
        description: "FK vers dim_date (date de réception FDA, nullable)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_case_outcome
    description: >
      Factless fact : une ligne par (cas retenu x issue). Un cas peut avoir
      plusieurs issues, donc primaryid n'est PAS unique ici.
    columns:
      - name: primaryid
        description: "FK vers dim_demo."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demo')
                field: primaryid
      - name: outc_cod
        description: "FK vers dim_outc."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_outc')
                field: outc_cod

  - name: signal_disproportionality
    description: >
      Mart de détection de signal (disproportionnalité). Grain : une ligne par
      couple (drug_key x reaction_key) observé dans fact_adverse_event, avec son
      tableau de contingence 2x2 (a, b, c, d) calculé sur des CAS distincts
      (primaryid), et les métriques associées : PRR, ROR avec intervalle de
      confiance à 95 % (ror_lower / ror_upper) et chi². is_signal applique le
      critère standard : a >= 3 et borne basse de l'IC95 du ROR > 1.
    columns:
      - name: drug_key
        description: "FK vers dim_drug"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: reaction_key
        description: "FK vers dim_reaction"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reaction')
                field: reaction_key
